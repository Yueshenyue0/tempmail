name: Build TempMail
on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create Android project files
        run: flutter create . --project-name tempmail --org com.eri --platforms android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ====== 让 SO 解压到磁盘（DynamicLibrary.open 需要物理文件） ======
      - name: Enable legacy native lib packaging
        run: |
          python3 - <<'PYEOF'
          import os
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
              f, is_kts = kts, True
          elif os.path.exists(groovy):
              f, is_kts = groovy, False
          else:
              raise SystemExit('no build.gradle(.kts) found')
          s = open(f, encoding='utf-8').read()
          if is_kts:
              block = (
                  '    packaging {\n'
                  '        jniLibs {\n'
                  '            useLegacyPackaging = true\n'
                  '        }\n'
                  '    }\n'
              )
          else:
              block = (
                  '    packagingOptions {\n'
                  '        jniLibs {\n'
                  '            useLegacyPackaging = true\n'
                  '        }\n'
                  '    }\n'
              )
          if 'useLegacyPackaging' not in s:
              s = s.replace('android {', 'android {\n' + block, 1)
              open(f, 'w', encoding='utf-8').write(s)
              print('useLegacyPackaging injected into', f)
          else:
              print('already set')
          PYEOF
          grep -rn 'useLegacyPackaging' android/app/ || true

      - name: Add permissions to manifest
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries><application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="tempmail"|android:label="TempMail"|' android/app/src/main/AndroidManifest.xml

      # ====== 固定签名（保证可覆盖安装） ======
      - name: Setup signing
        run: |
          cat > android/key.properties <<EOF
          storeFile=../key/tempmail.keystore
          storePassword=tempmail2026
          keyAlias=tempmail
          keyPassword=tempmail2026
          EOF
          python3 - <<'PYEOF'
          import os
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
              f, is_kts = kts, True
          elif os.path.exists(groovy):
              f, is_kts = groovy, False
          else:
              raise SystemExit('no build.gradle(.kts)')
          s = open(f, encoding='utf-8').read()
          if 'key.properties' in s:
              print('signing already configured')
          else:
              if is_kts:
                  cfg = (
                      "import java.util.Properties\\n"
                      "import java.io.FileInputStream\\n\\n"
                      "val keystoreProps = Properties().apply {\\n"
                      "    val f = rootProject.file(\"key.properties\")\\n"
                      "    if (f.exists()) FileInputStream(f).use { load(it) }\\n"
                      "}\\n\\n"
                  )
                  sign = (
                      "    signingConfigs {\\n"
                      "        create(\"release\") {\\n"
                      "            storeFile = file(keystoreProps[\"storeFile\"] as String)\\n"
                      "            storePassword = keystoreProps[\"storePassword\"] as String\\n"
                      "            keyAlias = keystoreProps[\"keyAlias\"] as String\\n"
                      "            keyPassword = keystoreProps[\"keyPassword\"] as String\\n"
                      "        }\\n"
                      "    }\\n"
                  )
                  rel = 'signingConfig = signingConfigs.getByName(\"release\")\\n'
              else:
                  cfg = ''
                  sign = (
                      "    signingConfigs {\\n"
                      "        release {\\n"
                      "            storeFile file(keystoreProps['storeFile'])\\n"
                      "            storePassword keystoreProps['storePassword']\\n"
                      "            keyAlias keystoreProps['keyAlias']\\n"
                      "            keyPassword keystoreProps['keyPassword']\\n"
                      "        }\\n"
                      "    }\\n"
                  )
                  rel = "signingConfig signingConfigs.release\\n"
              if is_kts and not s.startswith('import '):
                  s = cfg + s
              s = s.replace('android {', 'android {\\n' + sign, 1)
              s = s.replace('buildTypes {', 'buildTypes {\\n        release {\\n            ' + rel.strip() + '\\n        }', 1) if 'release {' not in s.split('buildTypes {')[1][:80] else s
              open(f, 'w', encoding='utf-8').write(s)
              print('signing injected into', f)
          PYEOF

      - name: Get dependencies
        run: flutter pub get

      # ====== 第一遍：编译 Dart 拿 libapp.so（通用单 APK） ======
      - name: First build (compile Dart libapp.so)
        run: flutter build apk --release

      - name: Extract libapp.so hashes per ABI
        run: |
          set -e
          : > /tmp/hashes.txt
          APK=build/app/outputs/flutter-apk/app-release.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -p "$APK" "lib/$abi/libapp.so" > /tmp/libapp_$abi.so 2>/dev/null && {
              H=$(sha256sum /tmp/libapp_$abi.so | awk '{print $1}')
              echo "$abi $H" >> /tmp/hashes.txt
              echo "ABI=$abi HASH=$H"
            } || true
          done
          cat /tmp/hashes.txt || echo "NO HASHES"

      # ====== 编译 libverify.so（静态链接 libstdc++，注入 hash） ======
      - name: Build native core
        run: |
          set -e
          NDK=""
          [ -n "$ANDROID_NDK_HOME" ] && NDK=$ANDROID_NDK_HOME
          [ -z "$NDK" ] && [ -n "$ANDROID_NDK" ] && NDK=$ANDROID_NDK
          [ -z "$NDK" ] && NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -1)
          [ -z "$NDK" ] && NDK=$(ls -d /usr/lib/android-ndk* 2>/dev/null | head -1)
          [ -z "$NDK" ] && { echo "ERROR: NDK not found"; exit 1; }
          echo "NDK=$NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          while read abi hash; do
            case "$abi" in
              arm64-v8a)   CXX="$TC/aarch64-linux-android26-clang++";;
              armeabi-v7a) CXX="$TC/armv7a-linux-androideabi26-clang++";;
              x86_64)      CXX="$TC/x86_64-linux-android26-clang++";;
            esac
            OUT="android/app/src/main/jniLibs/$abi"
            mkdir -p "$OUT"
            "$CXX" -std=c++11 -shared -fPIC -O2 -static-libstdc++ \
              -DEXPECTED_LIBAPP_SHA256=\"$hash\" \
              -o "$OUT/libverify.so" lib/native/verify.cpp
            echo "built $OUT/libverify.so"
          done < /tmp/hashes.txt
          find android/app/src/main/jniLibs -name 'libverify.so' | sort

      # ====== 第二遍：带 SO 重新打包（通用单 APK） ======
      - name: Rebuild APK with native core
        run: |
          rm -rf build/app/intermediates/flutter
          flutter build apk --release

      - name: Verify native libs in APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "=== app-release.apk ==="
          unzip -l "$APK" | grep -E 'libverify|libapp' || echo "MISSING NATIVE LIBS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tempmail-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # ====== 发布到 Canary release（每次 main 构建成功即覆盖上传） ======
      - name: Release to Canary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Canary
          name: Canary
          body: |
            最新 Canary 构建（commit ${{ github.sha }}）
            构建时间 ${{ github.event.head_commit.timestamp }}
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}