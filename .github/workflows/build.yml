name: Build TempMail
on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create Android project files
        run: flutter create . --project-name tempmail --org com.eri --platforms android

      # ====== 让 SO 解压到磁盘（DynamicLibrary.open 需要物理文件） ======
      - name: Enable legacy native lib packaging
        run: |
          python3 - <<'PYEOF'
          f = 'android/app/build.gradle'
          s = open(f, encoding='utf-8').read()
          block = (
              '    packagingOptions {\n'
              '        jniLibs {\n'
              '            useLegacyPackaging = true\n'
              '        }\n'
              '    }\n'
          )
          if 'useLegacyPackaging' not in s:
              s = s.replace('android {', 'android {\n' + block, 1)
              open(f, 'w', encoding='utf-8').write(s)
              print('useLegacyPackaging injected')
          else:
              print('already set')
          PYEOF
          grep -n 'useLegacyPackaging' android/app/build.gradle || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Add permissions to manifest
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="tempmail"|android:label="TempMail"|' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      # ====== 第一遍：编译 Dart 拿 libapp.so（通用单 APK） ======
      - name: First build (compile Dart libapp.so)
        run: flutter build apk --release

      - name: Extract libapp.so hashes per ABI
        run: |
          set -e
          : > /tmp/hashes.txt
          APK=build/app/outputs/flutter-apk/app-release.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -p "$APK" "lib/$abi/libapp.so" > /tmp/libapp_$abi.so 2>/dev/null && {
              H=$(sha256sum /tmp/libapp_$abi.so | awk '{print $1}')
              echo "$abi $H" >> /tmp/hashes.txt
              echo "ABI=$abi HASH=$H"
            } || true
          done
          cat /tmp/hashes.txt || echo "NO HASHES"

      # ====== 编译 libverify.so（静态链接 libstdc++，注入 hash） ======
      - name: Build native core
        run: |
          set -e
          NDK=""
          [ -n "$ANDROID_NDK_HOME" ] && NDK=$ANDROID_NDK_HOME
          [ -z "$NDK" ] && [ -n "$ANDROID_NDK" ] && NDK=$ANDROID_NDK
          [ -z "$NDK" ] && NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -1)
          [ -z "$NDK" ] && NDK=$(ls -d /usr/lib/android-ndk* 2>/dev/null | head -1)
          [ -z "$NDK" ] && { echo "ERROR: NDK not found"; exit 1; }
          echo "NDK=$NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          while read abi hash; do
            case "$abi" in
              arm64-v8a)   CXX="$TC/aarch64-linux-android26-clang++";;
              armeabi-v7a) CXX="$TC/armv7a-linux-androideabi26-clang++";;
              x86_64)      CXX="$TC/x86_64-linux-android26-clang++";;
            esac
            OUT="android/app/src/main/jniLibs/$abi"
            mkdir -p "$OUT"
            "$CXX" -std=c++11 -shared -fPIC -O2 -static-libstdc++ \
              -DEXPECTED_LIBAPP_SHA256=\"$hash\" \
              -o "$OUT/libverify.so" lib/native/verify.cpp
            echo "built $OUT/libverify.so"
          done < /tmp/hashes.txt
          find android/app/src/main/jniLibs -name 'libverify.so' | sort

      # ====== 第二遍：带 SO 重新打包（通用单 APK） ======
      - name: Rebuild APK with native core
        run: |
          rm -rf build/app/intermediates/flutter
          flutter build apk --release

      - name: Verify native libs in APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "=== app-release.apk ==="
          unzip -l "$APK" | grep -E 'libverify|libapp' || echo "MISSING NATIVE LIBS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tempmail-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14